[package]
name = "quoll"
description = "A modern, type-safe REST toolkit for Rust: from a client for any API to the server behind your frontend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The official schema of OpenAPI 3.1, under the Apache License 2.0, which only the tests read.
exclude = ["tests/openapi/"]

# The docs of both sides, each item marked with the feature it needs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Each side of a contract compiles only with its feature, so that a command line
# never links axum, nor a server reqwest.
server = [
    "dep:axum",
    "dep:futures-util",
    "dep:serde_html_form",
    "dep:tokio",
    # The files of a page.
    "tokio/fs",
    # The signals a server stops on, and the start of its grace.
    "tokio/signal",
    "tokio/sync",
    "dep:tower-http",
    "dep:tower-layer",
    "dep:tower-service",
    "dep:tracing",
]
client = [
    "dep:bytes",
    "dep:futures-util",
    "dep:reqwest",
    "dep:reqwest-middleware",
    "dep:backon",
    "dep:fastrand",
    "dep:httpdate",
    "dep:reqwest-tracing",
    "dep:serde_html_form",
    "dep:tokio",
    "dep:tracing",
    "dep:url",
    "dep:uuid",
]

[dependencies]
# The backoff of `client::retry`, out of every public signature.
backon = { version = "1.6", default-features = false, features = ["std"], optional = true }
# The user and the password of `Basic`, which the server reads and the client writes.
base64 = "0.23"
# `http1` and `tokio` serve a router, as `quoll::test::spawn` does.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"], optional = true }
# The body of an answer as reqwest reads it, which the client parses without a copy.
bytes = { version = "1", optional = true }
# The jitter of the waits of `client::follow`, out of every public signature.
fastrand = { version = "2", optional = true }
# The `Stream` trait, which `Events` and `JsonLines` implement and are built from.
futures-core = { version = "0.3", default-features = false }
# What each side builds its streams with.
futures-util = { version = "0.3", default-features = false, optional = true }
http = "1"
# The HTTP date of a `Retry-After`, which `client::Attempt::retry_after` reads.
httpdate = { version = "1", optional = true }
# The key of a query scheme, which the server reads with neither feature.
percent-encoding = "2"
# The values of a stream result written as results, with no box of their own.
pin-project-lite = "0.2"
quoll-macros = { version = "0.10.0", path = "../quoll-macros" }
# TLS through rustls with the platform's roots, and the system's proxy settings, as reqwest's defaults have them.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"], optional = true }
reqwest-middleware = { version = "0.5", optional = true }
# What `client::trace` is built on, out of every public signature.
reqwest-tracing = { version = "0.7", optional = true }
# The schemas of the OpenAPI document, which every type of a contract has, whatever the features.
schemars = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_html_form = { version = "0.4", optional = true }
# The OpenAPI document, which is JSON, and the bodies of each side.
serde_json = "1"
# A stream result is `Sync` through it, whatever its stream, which it polls through `&mut` alone.
sync_wrapper = "1"
# `time` for the keep-alive comments of server-sent events, and the deadline of the head of a stream's answer.
# 1.50 for `TcpStream::set_zero_linger`, the reset of a connection whose client takes no bytes.
tokio = { version = "1.50", features = ["net", "rt", "time"], optional = true }
# The span of `server::trace`, CORS and compression, each behind a layer of quoll's own, and `ServeDir`, which serves
# the files of a page.
tower-http = { version = "0.6", default-features = false, features = [
    "compression-br",
    "compression-gzip",
    "compression-zstd",
    "cors",
    "fs",
    "trace",
], optional = true }
# The traits of the layers of `server`, which axum's `Router::layer` takes.
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
# The origin of the api, which the client compares with each request's.
url = { version = "2", optional = true }
# The `X-Request-Id` of `client::request_id`.
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
# Validates the OpenAPI documents of the tests against the official schema of OpenAPI 3.1.
jsonschema = { version = "0.61", default-features = false }
schemars = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false }
# The connection a daemon of a test takes back from axum after its 101, as an application's server would.
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["gzip", "json"] }
reqwest-middleware = "0.5"
# A format that writes the length of a map, which the fixed fields of a body keep exact.
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The directories of a page, made for a test and removed after it.
tempfile = "3"
# `test-util` pauses the time of the tests that wait, those of `client::follow` among them.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
trybuild = "1"

[lints]
workspace = true
