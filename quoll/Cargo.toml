[package]
name = "quoll"
description = "A REST contract for Rust, written once: an axum server, a reqwest client and an OpenAPI document"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Each side of a contract compiles only with its feature, so that a command line
# never links axum, nor a server reqwest.
server = [
    "dep:axum",
    "dep:percent-encoding",
    "dep:serde",
    "dep:serde_html_form",
    "dep:serde_json",
    "dep:tracing",
]
client = [
    "dep:percent-encoding",
    "dep:reqwest",
    "dep:reqwest-middleware",
    "dep:serde",
    "dep:serde_html_form",
    "dep:serde_json",
]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"], optional = true }
http = "1"
percent-encoding = { version = "2", optional = true }
quoll-macros = { version = "0.1.0", path = "../quoll-macros" }
# TLS through rustls with the platform's roots, and the system's proxy settings, as reqwest's defaults have them.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"], optional = true }
reqwest-middleware = { version = "0.5", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_html_form = { version = "0.4", optional = true }
serde_json = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
reqwest-middleware = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
trybuild = "1"

[lints]
workspace = true
