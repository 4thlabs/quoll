# nginx in front of Quoll's server, as a reverse proxy: kept upstream connections, WebSocket and server-sent events.
events {}

http {
  upstream quoll {
    server quoll:18080;
    keepalive 8;
  }

  # Below the 6 s the client waits, so that it meets a connection nginx closed for being idle.
  keepalive_timeout 3s;

  server {
    listen 8080;

    # The number of the client's connection to nginx, for the checks of a kept connection.
    location = /connection {
      return 200 $connection;
    }

    location /ws {
      proxy_pass http://quoll;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 300s;
    }

    location / {
      proxy_pass http://quoll;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      client_max_body_size 64m;
    }
  }
}
