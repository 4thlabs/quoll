name: Load

# A mixed load on a server and its clients, each on several threads, under ThreadSanitizer and under AddressSanitizer
# with UndefinedBehaviorSanitizer (tests/load). Too long for every pull request, and a race found by chance has nothing
# to do with the change it would fail: a pull request touching the program runs it briefly, as nothing else builds it.
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/load/**"
      - ".github/workflows/load.yml"

permissions:
  contents: read

# A new push to a pull request cancels its previous run; the nightly runs go to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  load:
    name: load ${{ matrix.sanitizer.name }}
    runs-on: ubuntu-24.04
    # Five minutes of load at night, the build, and a slow mirror when the packages change.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - { name: tsan, flags: -fsanitize=thread }
          - { name: asan-ubsan, flags: -fsanitize=address,undefined -fno-sanitize-recover=all }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

      # The runner's address space randomization is too wide for the sanitizer runtimes of GCC 13.
      - name: Reduce address space randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Set up ccache
        uses: ./.github/actions/ccache
        with:
          job: load-${{ matrix.sanitizer.name }}

      # Debug keeps the library's assertions; -O1 gets more requests through in the time.
      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DQUOLL_LOAD=ON -DQUOLL_BUILD_TESTS=OFF -DQUOLL_BUILD_SAMPLES=OFF
          -DQUOLL_TLS=ON
          "-DCMAKE_C_FLAGS=${{ matrix.sanitizer.flags }} -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=${{ matrix.sanitizer.flags }} -fno-omit-frame-pointer -O1"
        env:
          CXX: g++-13

      - name: Build
        run: cmake --build build --target quoll_load --parallel "$(nproc)"

      # A sanitizer's report fails the run: ThreadSanitizer exits with 66 once it has reported, the others stop at once.
      - name: Load
        run: build/tests/load/quoll_load ${{ github.event_name == 'pull_request' && 30 || 300 }} 4 32
        env:
          UBSAN_OPTIONS: print_stacktrace=1
