name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to main keeps its own run: only a pull request's superseded runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Every job below runs once per combination of the quoll features, none, each alone and both, with the guides left
  # out: they turn quoll's features on, which cargo would unify into the whole build. The guides run on their own,
  # their blocks doctests, and so does quoll-cli, which does not depend on quoll; the job web runs it on the notes
  # example. The examples are workspaces of their own, in the job examples.
  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: none, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: "" }
          - { name: server, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: server }
          - { name: client, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: client }
          - { name: all, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: "server,client" }
          - { name: guides, packages: "--package quoll-guides", features: "" }
          - { name: cli, packages: "--package quoll-cli", features: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy ${{ matrix.packages }} --all-targets --features "${{ matrix.features }}" -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: none, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: "" }
          - { name: server, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: server }
          - { name: client, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: client }
          - { name: all, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: "server,client" }
          - { name: guides, packages: "--package quoll-guides", features: "" }
          - { name: cli, packages: "--package quoll-cli", features: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.packages }} --features "${{ matrix.features }}"

  doc:
    name: doc (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: none, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: "" }
          - { name: server, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: server }
          - { name: client, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: client }
          - { name: all, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: "server,client" }
          - { name: guides, packages: "--package quoll-guides", features: "" }
          - { name: cli, packages: "--package quoll-cli", features: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc ${{ matrix.packages }} --no-deps --features "${{ matrix.features }}"

  # The crates on the oldest Rust they support, the `rust-version` of the root's Cargo.toml, with each feature
  # combination as in the job test. The lints and the messages are those of the latest stable, which the jobs above
  # check: warnings are not errors here, and trybuild writes the messages of this rustc instead of comparing them. It
  # still fails when a mistake compiles or a valid contract does not. It does not check why a mistake fails on this
  # rustc, only that it fails.
  msrv:
    name: msrv (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      RUSTDOCFLAGS: ""
      TRYBUILD: overwrite
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: none, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: "" }
          - { name: server, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: server }
          - { name: client, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: client }
          - { name: all, packages: "--workspace --exclude quoll-guides --exclude quoll-cli", features: "server,client" }
          - { name: guides, packages: "--package quoll-guides", features: "" }
          - { name: cli, packages: "--package quoll-cli", features: "" }
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.packages }} --features "${{ matrix.features }}" --locked

  # quoll-cli on macOS and Windows, where `cargo quoll dev` stops its children in other ways than on Linux: its lints,
  # which see the code of each OS, and its tests, which run a real server and stop it.
  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --package quoll-cli --all-targets -- -D warnings
      - run: cargo test --package quoll-cli

  # Each example is a workspace of its own, as an application's is, built in its directory with the features its crates
  # choose, and with `--locked`, so that its committed Cargo.lock is the one it builds with.
  examples:
    name: examples (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [notes, docker]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/${{ matrix.example }}
          key: ${{ matrix.example }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          # The runners have Docker: the Docker example's test against a real daemon fails there when none answers,
          # rather than skip.
          DOCKER_CLI_TEST_DAEMON: ${{ matrix.example == 'docker' && 'required' || '' }}
      - run: cargo doc --workspace --no-deps --locked

  # The notes example's page: `cargo quoll build` writes the document, runs orval through its `after`, then checks the
  # types of the page and bundles it, so that a change of the contract that breaks the page breaks the pull request.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/notes/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # The root's workspace, where cargo-quoll is built, and the example's, which it builds.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/notes -> target
      - run: npm ci
        working-directory: examples/notes/web
      # Built in the root's target directory, which the cache keeps, rather than by `cargo install`.
      - run: |
          cargo build --package quoll-cli
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - run: cargo quoll build
        working-directory: examples/notes
      - run: npm test
        working-directory: examples/notes/web

  # The one check branch protection requires: it fails when any job above failed or was skipped.
  ci:
    if: always()
    needs: [fmt, clippy, test, doc, msrv, cli, examples, web]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            exit 1
          fi
