name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on main go to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  native:
    name: ${{ matrix.compiler.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-13, cxx: g++-13 }
          - { name: clang-19, cxx: clang++-19 }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

      # Clang 19, the oldest Clang Quoll supports, is not preinstalled on the runner.
      - name: Install Clang
        if: startsWith(matrix.compiler.name, 'clang')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-19

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
        env:
          CXX: ${{ matrix.compiler.cxx }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: gcc-13 ${{ matrix.sanitizer.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - { name: tsan, flags: -fsanitize=thread }
          - { name: asan-ubsan, flags: -fsanitize=address,undefined -fno-sanitize-recover=all }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

      # The runner's address space randomization is too wide for the sanitizer runtimes of GCC 13.
      - name: Reduce address space randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        # The C flags too: llhttp is C.
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_C_FLAGS=${{ matrix.sanitizer.flags }} -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=${{ matrix.sanitizer.flags }} -fno-omit-frame-pointer"
        env:
          CXX: g++-13

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  wasm:
    name: emscripten
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # emcmake sets CMAKE_CROSSCOMPILING_EMULATOR to emsdk's node: ctest runs the tests under node.
      - name: Configure
        run: emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-wasm -j

      - name: Test
        run: ctest --test-dir build-wasm --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check formatting
        run: git ls-files '*.hpp' '*.cpp' | xargs -r clang-format-18 --dry-run --Werror
