name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on main go to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  native:
    name: ${{ matrix.compiler.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-13, cxx: g++-13 }
          - { name: clang-18, cxx: clang++-18 }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
        env:
          CXX: ${{ matrix.compiler.cxx }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  wasm:
    name: emscripten
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # emcmake sets CMAKE_CROSSCOMPILING_EMULATOR to emsdk's node: ctest runs the tests under node.
      - name: Configure
        run: emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-wasm -j

      - name: Test
        run: ctest --test-dir build-wasm --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check formatting
        run: git ls-files '*.hpp' '*.cpp' | xargs -r clang-format-18 --dry-run --Werror
