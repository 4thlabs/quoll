name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to main keeps its own run: only a pull request's superseded runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Every job below runs once per combination of the quoll features, none, each alone and both, with the example left
  # out: its crates turn quoll's features on, which cargo would unify into the whole build. The example runs on its
  # own, with the features its crates choose.
  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: none, packages: "--workspace --exclude 'notes-*'", features: "" }
          - { name: server, packages: "--workspace --exclude 'notes-*'", features: server }
          - { name: client, packages: "--workspace --exclude 'notes-*'", features: client }
          - { name: all, packages: "--workspace --exclude 'notes-*'", features: "server,client" }
          - { name: example, packages: "--package 'notes-*'", features: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy ${{ matrix.packages }} --all-targets --features "${{ matrix.features }}" -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: none, packages: "--workspace --exclude 'notes-*'", features: "" }
          - { name: server, packages: "--workspace --exclude 'notes-*'", features: server }
          - { name: client, packages: "--workspace --exclude 'notes-*'", features: client }
          - { name: all, packages: "--workspace --exclude 'notes-*'", features: "server,client" }
          - { name: example, packages: "--package 'notes-*'", features: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.packages }} --features "${{ matrix.features }}"

  doc:
    name: doc (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: none, packages: "--workspace --exclude 'notes-*'", features: "" }
          - { name: server, packages: "--workspace --exclude 'notes-*'", features: server }
          - { name: client, packages: "--workspace --exclude 'notes-*'", features: client }
          - { name: all, packages: "--workspace --exclude 'notes-*'", features: "server,client" }
          - { name: example, packages: "--package 'notes-*'", features: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc ${{ matrix.packages }} --no-deps --features "${{ matrix.features }}"

  # The one check branch protection requires: it fails when any job above failed or was skipped.
  ci:
    if: always()
    needs: [fmt, clippy, test, doc]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            exit 1
          fi
