name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on main go to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  native:
    name: ${{ matrix.compiler.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-13, cxx: g++-13, header-checks: ON }
          # The runner's default libstdc++ is GCC 14's: with Clang 19, its C++23 tuple-like comparisons break
          # Catch2's expression decomposition (REQUIRE on a tuple or an optional of one). Clang uses GCC 13's
          # libstdc++, as the dev container does: the header checks, which depend on what a library's headers include,
          # would mostly repeat GCC's. Emscripten runs them on its libc++, for the modules it builds.
          - name: clang-19
            cxx: clang++-19
            cxxflags: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13
            header-checks: OFF

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

      - name: Set up ccache
        uses: ./.github/actions/ccache
        with:
          job: ${{ matrix.compiler.name }}

      # Clang 19, the oldest Clang Quoll supports, is not preinstalled on the runner.
      - name: Install Clang
        if: startsWith(matrix.compiler.name, 'clang')
        uses: ./.github/actions/apt-packages
        with:
          packages: clang-19 clang-tidy-19

      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DQUOLL_HEADER_CHECKS=${{ matrix.compiler.header-checks }} -DQUOLL_TLS=ON
        env:
          CXX: ${{ matrix.compiler.cxx }}
          CXXFLAGS: ${{ matrix.compiler.cxxflags }}

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300 --parallel "$(nproc)"

      # Quoll's own sources only: the rules are in .clang-tidy. It also reports when a test failed, and it would pass
      # with no file selected, hence the count. Keep the command in step with AGENTS.md.
      - name: clang-tidy
        if: ${{ !cancelled() && startsWith(matrix.compiler.name, 'clang') }}
        run: |
          sources='/(quoll|samples)/.*\.cpp$'
          test "$(jq -r '.[].file' build/compile_commands.json | grep -cE "$PWD$sources")" -gt 0
          run-clang-tidy-19 -p build -quiet -j "$(nproc)" "$PWD$sources"

      # Without OpenSSL, which applications may lack: the tests say what https:// then does.
      - name: Test without TLS
        if: matrix.compiler.name == 'gcc-13'
        run: |
          cmake -B build-no-tls -DCMAKE_BUILD_TYPE=Debug -DQUOLL_HEADER_CHECKS=OFF -DQUOLL_TLS=OFF
          cmake --build build-no-tls --parallel "$(nproc)"
          ctest --test-dir build-no-tls --output-on-failure --timeout 300 --parallel "$(nproc)" --exclude-regex "^compile_fail"

  # Apple Clang and its libc++, in a version of its own: Apple numbers them apart from LLVM. Xcode is pinned on the oldest
  # supported, as Clang is on Linux. The header checks run here too, as Emscripten's libc++ does not cover the native
  # modules. The compile_fail ctests do not: two compilers check them, and they bypass ccache.
  macos:
    name: macos
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

      - name: Set up ccache
        uses: ./.github/actions/ccache
        with:
          job: macos

      - name: Choose Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Show the compiler
        run: c++ --version

      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DQUOLL_HEADER_CHECKS=ON -DQUOLL_TLS=ON
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Test
        run: >-
          ctest --test-dir build --output-on-failure --timeout 300 --parallel "$(sysctl -n hw.ncpu)" --exclude-regex "^compile_fail"

      - name: Show how ccache did
        run: ccache --show-stats

  sanitizers:
    name: gcc-13 ${{ matrix.sanitizer.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - { name: tsan, flags: -fsanitize=thread }
          - { name: asan-ubsan, flags: -fsanitize=address,undefined -fno-sanitize-recover=all }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

      # The runner's address space randomization is too wide for the sanitizer runtimes of GCC 13.
      - name: Reduce address space randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Set up ccache
        uses: ./.github/actions/ccache
        with:
          job: ${{ matrix.sanitizer.name }}

      # What only the compiler checks is checked without the sanitizers: no header checks, no compile_fail ctests.
      - name: Configure
        # The C flags too: llhttp is C.
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DQUOLL_HEADER_CHECKS=OFF -DQUOLL_TLS=ON
          "-DCMAKE_C_FLAGS=${{ matrix.sanitizer.flags }} -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=${{ matrix.sanitizer.flags }} -fno-omit-frame-pointer"
        env:
          CXX: g++-13

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300 --parallel "$(nproc)" --exclude-regex "^compile_fail"

  wasm:
    name: emscripten
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

      - name: Set up ccache
        uses: ./.github/actions/ccache
        with:
          job: emscripten
          emscripten: 'true'

      # Rather than setup-emsdk, whose v14 fails to restore its cache (a 400) and so installs in a random folder: that path is
      # in every compilation, and ccache would never find one again.
      - name: Set up Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          {
            echo "$HOME/emsdk"
            echo "$HOME/emsdk/upstream/emscripten"
          } >> "$GITHUB_PATH"

      # emcmake sets CMAKE_CROSSCOMPILING_EMULATOR to emsdk's node: ctest runs the tests under node.
      - name: Configure
        run: emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-wasm --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build-wasm --output-on-failure --timeout 300

      - name: Show how ccache did
        run: ccache --show-stats

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check formatting
        run: git ls-files '*.hpp' '*.cpp' | xargs -r clang-format-18 --dry-run --Werror
