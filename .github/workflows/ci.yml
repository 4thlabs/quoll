name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to main keeps its own run: only a pull request's superseded runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Every job below runs once per combination of the quoll features, none, each alone and both, with the examples and
  # the guides left out: their crates turn quoll's features on, which cargo would unify into the whole build. The
  # examples run on their own, with the features their crates choose, and the guides with them, their blocks doctests.
  # quoll-cli, which does not depend on quoll, runs once on its own: its tests run `cargo quoll` on the notes example.
  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: none, packages: "--workspace --exclude 'notes-*' --exclude 'docker-*' --exclude quoll-guides --exclude quoll-cli", features: "" }
          - { name: server, packages: "--workspace --exclude 'notes-*' --exclude 'docker-*' --exclude quoll-guides --exclude quoll-cli", features: server }
          - { name: client, packages: "--workspace --exclude 'notes-*' --exclude 'docker-*' --exclude quoll-guides --exclude quoll-cli", features: client }
          - { name: all, packages: "--workspace --exclude 'notes-*' --exclude 'docker-*' --exclude quoll-guides --exclude quoll-cli", features: "server,client" }
          - { name: examples, packages: "--package 'notes-*' --package 'docker-*' --package quoll-guides", features: "" }
          - { name: cli, packages: "--package quoll-cli", features: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy ${{ matrix.packages }} --all-targets --features "${{ matrix.features }}" -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: none, packages: "--workspace --exclude 'notes-*' --exclude 'docker-*' --exclude quoll-guides --exclude quoll-cli", features: "" }
          - { name: server, packages: "--workspace --exclude 'notes-*' --exclude 'docker-*' --exclude quoll-guides --exclude quoll-cli", features: server }
          - { name: client, packages: "--workspace --exclude 'notes-*' --exclude 'docker-*' --exclude quoll-guides --exclude quoll-cli", features: client }
          - { name: all, packages: "--workspace --exclude 'notes-*' --exclude 'docker-*' --exclude quoll-guides --exclude quoll-cli", features: "server,client" }
          - { name: examples, packages: "--package 'notes-*' --package 'docker-*' --package quoll-guides", features: "" }
          - { name: cli, packages: "--package quoll-cli", features: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.packages }} --features "${{ matrix.features }}"
        env:
          # The runners have Docker: the example's test against a real daemon fails there when none answers, rather
          # than skip.
          DOCKER_CLI_TEST_DAEMON: ${{ matrix.name == 'examples' && 'required' || '' }}

  doc:
    name: doc (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: none, packages: "--workspace --exclude 'notes-*' --exclude 'docker-*' --exclude quoll-guides --exclude quoll-cli", features: "" }
          - { name: server, packages: "--workspace --exclude 'notes-*' --exclude 'docker-*' --exclude quoll-guides --exclude quoll-cli", features: server }
          - { name: client, packages: "--workspace --exclude 'notes-*' --exclude 'docker-*' --exclude quoll-guides --exclude quoll-cli", features: client }
          - { name: all, packages: "--workspace --exclude 'notes-*' --exclude 'docker-*' --exclude quoll-guides --exclude quoll-cli", features: "server,client" }
          - { name: examples, packages: "--package 'notes-*' --package 'docker-*' --package quoll-guides", features: "" }
          - { name: cli, packages: "--package quoll-cli", features: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc ${{ matrix.packages }} --no-deps --features "${{ matrix.features }}"

  # The one check branch protection requires: it fails when any job above failed or was skipped.
  ci:
    if: always()
    needs: [fmt, clippy, test, doc]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            exit 1
          fi
