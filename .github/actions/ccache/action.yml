name: ccache
description: Installs ccache and restores its cache, kept per job. Configure with the launcher variables to use it.

inputs:
  job:
    description: Name of the cache, one per set of compiler flags.
    required: true

runs:
  using: composite
  steps:
    - name: Install ccache
      shell: bash
      run: sudo apt-get install -y --no-install-recommends ccache

    - name: Cache compilations
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ inputs.job }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.job }}-

    - name: Use ccache
      shell: bash
      run: |
        ccache --set-config=max_size=500M
        ccache --zero-stats
        {
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"
