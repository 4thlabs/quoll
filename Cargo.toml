[workspace]
# The library's crates. The examples are workspaces of their own, as an application's is, and the fixture of
# quoll-cli's tests is the workspace they copy and run `cargo quoll` on.
members = ["quoll", "quoll-macros", "quoll-cli", "docs/guides"]
exclude = ["examples/notes", "examples/docker", "quoll-cli/tests/fixture"]
resolver = "3"

[workspace.package]
version = "0.9.2"
edition = "2024"
# The oldest Rust that builds and tests the crates. quoll-cli's watcher, notify-types, needs 1.91, and so does the
# code the macro writes, which calls `TypeId::of` in a constant. It is raised only in a minor version.
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/4thlabs/quoll"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

