[workspace]
members = [
    "quoll",
    "quoll-macros",
    "quoll-cli",
    "examples/notes/api",
    "examples/notes/server",
    "examples/notes/cli",
    "examples/docker/api",
    "examples/docker/cli",
    "docs/guides",
]
# The workspace that the tests of quoll-cli copy and run `cargo quoll` on.
exclude = ["quoll-cli/tests/fixture"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/4thlabs/quoll"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The config of `cargo quoll`, for the notes example: its document and the TypeScript orval writes from it, both
# gitignored, its server and its web page.
[[workspace.metadata.quoll.api]]
package = "notes-api"
bin = "openapi"
output = "examples/notes/web/openapi.json"
after = [["npx", "orval"]]

[[workspace.metadata.quoll.server]]
package = "notes-server"
url = "http://127.0.0.1:8080"

[workspace.metadata.quoll.web]
dir = "examples/notes/web"
dev = ["npm", "run", "dev"]
build = ["npm", "run", "build"]
