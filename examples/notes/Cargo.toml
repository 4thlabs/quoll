# The notes example, a workspace of its own as an application's is: its contract, its server and its command line,
# and its web page in `web/`, which no crate holds.
[workspace]
members = ["api", "server", "cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

# quoll from this repository. An application names it from git, at a version's tag:
# `quoll = { git = "https://github.com/4thlabs/quoll", tag = "v0.9.2" }`.
[workspace.dependencies]
quoll = { path = "../../quoll" }

[workspace.lints.rust]
unsafe_code = "forbid"

# The config of `cargo quoll`, run from this directory, its paths relative to it. The contract's binary writes the
# document, and orval the TypeScript from it, both gitignored.
[[workspace.metadata.quoll.api]]
package = "notes-api"
bin = "openapi"
output = "web/openapi.json"
# Run in the directory of `output`. `--no`: the orval of the page's package-lock.json, which `npm ci` installs, never
# one npx would download.
after = [["npx", "--no", "orval"]]

# Run by `cargo quoll dev`, ready once its url accepts a connection. The page's vite.config.ts proxies `/api` to this
# url: the two change together.
[[workspace.metadata.quoll.server]]
package = "notes-server"
url = "http://127.0.0.1:8080"

# The page: `dev` runs beside the server in `cargo quoll dev`, `build` after the document in `cargo quoll build`, both
# in `dir`.
[workspace.metadata.quoll.web]
dir = "web"
dev = ["npm", "run", "dev"]
build = ["npm", "run", "build"]
