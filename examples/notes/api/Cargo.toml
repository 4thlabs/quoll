[package]
name = "notes-api"
description = "The contract of the notes example: its models and its routes"
edition.workspace = true
license.workspace = true
publish = false

[features]
server = ["quoll/server"]
client = ["quoll/client"]

[dependencies]
quoll = { path = "../../../quoll" }
schemars = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Validates the document against the official schema of OpenAPI 3.1, which quoll's tests hold.
jsonschema = { version = "0.61", default-features = false }
serde_json = "1"

[lints]
workspace = true
