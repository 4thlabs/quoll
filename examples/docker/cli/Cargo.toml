[package]
name = "docker-cli"
description = "The command line of the Docker example: lists, inspects, starts and stops containers, follows their logs and the daemon's events"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
docker-api = { path = "../api", features = ["client"] }
futures = "0.3"
quoll.workspace = true
reqwest = { version = "0.13", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "net", "process", "time"] }

[lints]
workspace = true
