# The Docker example, a workspace of its own as an application's is: its contract and its command line.
[workspace]
members = ["api", "cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

# quoll from this repository; an application names it from git, `quoll = { git = "https://github.com/4thlabs/quoll" }`.
[workspace.dependencies]
quoll = { path = "../../quoll" }

[workspace.lints.rust]
unsafe_code = "forbid"
